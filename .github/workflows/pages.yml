name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWAKENWORKS_SITE_URL: https://awakenworks.com
      AWAKENWORKS_BASE_PATH: /
      PUBLIC_AWAKENWORKS_BUILD_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate standalone content and Pages paths
        run: |
          pnpm check:standalone
          node scripts/check-home.mjs
          node scripts/check-docs.mjs
          node scripts/check-pages-base.mjs

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify browser journeys before publication
        run: pnpm exec playwright test

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure-${{ github.sha }}
          path: test-results/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    env:
      UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout release gate
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed revision
        env:
          AWAKENWORKS_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            node scripts/check-live.mjs && exit 0
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          exit 1

      - name: Verify analytics data plane
        if: ${{ env.UMAMI_API_KEY != '' }}
        env:
          AWAKENWORKS_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/check-analytics-live.mjs

      - name: Record unconfigured analytics readback
        if: ${{ env.UMAMI_API_KEY == '' }}
        run: |
          echo "Website tracking uses the configured public SITE ID. Private API readback was not run because UMAMI_API_KEY is not configured." >> "$GITHUB_STEP_SUMMARY"
